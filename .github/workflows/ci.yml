name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@next

      - name: Install frontend dependencies
        run: cd src/frontend && npm ci

      - name: Install backend dependencies
        run: cd src/backend && cargo fetch

      - name: Lint frontend
        run: cd src/frontend && npm run lint

      - name: Lint backend
        run: cd src/backend && cargo clippy -- -D warnings

      - name: Format check frontend
        run: cd src/frontend && npm run format:check

      - name: Format check backend
        run: cd src/backend && cargo fmt -- --check

      - name: Test frontend
        run: cd src/frontend && npm run test

      - name: Test backend
        run: cd src/backend && cargo test

      - name: Build frontend
        run: cd src/frontend && npm run build

      - name: Build backend
        run: cd src/backend && cargo build

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@next

      - name: Install dependencies
        run: |
          cd src/frontend && npm ci
          cd src/backend && cargo fetch

      - name: Build Tauri app
        run: npm run tauri:build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
